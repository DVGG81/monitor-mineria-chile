name: Recoleccion semanal mineria Chile

on:
  schedule:
    # cron en UTC. 11:00 UTC = 08:00 en Santiago durante horario de verano
    # (sept-abr). En invierno (abr-sept) equivale a 07:00 local; si prefieres
    # 08:00 exactas en invierno usa "0 12 * * 1".
    - cron: "0 11 * * 1"
  workflow_dispatch:   # permite ejecutarlo a mano desde la pestaña Actions

permissions:
  contents: write      # necesario para que el bot haga commit de los datos

jobs:
  recolectar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Ejecutar recolector
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python collector.py

      - name: Publicar datos actualizados
        run: |
          git config user.name  "monitor-mineria-bot"
          git config user.email "actions@github.com"
          git add docs/data/latest.json docs/data/history.json
          if git diff --staged --quiet; then
            echo "Sin cambios que publicar."
          else
            git commit -m "Datos mineria Chile $(date -u +'%Y-%m-%d')"
            # Si el repo avanzó mientras corría el recolector (ej. un push manual
            # en paralelo), rebase antes de subir en vez de fallar con "rejected".
            # -X ours: ante un conflicto en los propios archivos de datos, se
            # prefiere la corrida más nueva (la de este job).
            git pull --rebase -X ours origin main
            git push
          fi
